<body>

  <header class="header">

  <nav class="dates">

  <main class="main">
    
    <h2 class = "mainDate">date</h2>

      <button class="chip" type="button" data-type="1">спорт</button>
      <button class="chip" type="button" data-type="2">наука</button>

<div class="hidden overlay" id="signUpModal">
  <div class="signUpModal">
    <h2>Записаться на мероприятие</h2>
    <div class="modal-event-info">
      <span class="type" id="modalEventType"></span>
      <p class="modal-event-title" id="modalEventTitle"></p>
      <p class="modal-event-meta" id="modalEventMeta"></p>
    </div>
    <div class="submit-btn-block">
      <button type="button" class="button cancelBtn">Отмена</button>
      <button type="submit" class="button submitBtn">Записаться</button>
    </div>
  </div>
</div>
  <div class="overlay hidden" id = "successSignInModal">
    <div class="success-sign-in-modal">
      <h1>Вы успешно записаны!</h1>
      <div class="close-sign-in-modal">
        <button class="btn closeSignInModalBtn" >Закрыть</button>
      </div>
    </div>
  </div>
<script type="module" src="../js/main.js"></script>
