<!DOCTYPE html>
<html lang="ru">
<head>
  <link rel="shortcut icon" href="../images/faviconNoBG.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Профиль — Расписание мероприятий Инпит</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/account.css">
</head>
<body>

  <header class="header">
    <a href="index.html"><img src="../images/logoNoBG.png" alt="logo" class="logo"></a>
    <div class="header-icons">
      <a href="index.html" class="header-link">К расписанию</a>
    </div>
  </header>

  <main class="account-main">

    <div class="profile-card">
      <div class="profile-avatar">И</div>
      <div class="profile-info">
        <h2>Иван Иванов</h2>
        <p>ivan_ivanov · студент</p>
      </div>
      <div class="profile-actions">
        <a href="login.html" class="header-link">Выйти</a>
      </div>
    </div>

    <section class="profile-section">
      <h3>Мои записи</h3>

      <div class="profile-event-row">
        <div class="profile-event-date">27<br>августа</div>
        <div class="profile-event-body">
          <span class="type">Волонтерство</span>
          <h4>Посадка деревьев</h4>
          <p>ИНПИТ · 14:00</p>
        </div>
        <a href="#" class="profile-cancel-btn">Отменить запись</a>
      </div>

      <div class="profile-event-row">
        <div class="profile-event-date">8<br>августа</div>
        <div class="profile-event-body">
          <span class="type">Наука</span>
          <h4>Хакатон</h4>
          <p>Ауд. 312 · 14:00</p>
        </div>
        <a href="#" class="profile-cancel-btn">Отменить запись</a>
      </div>
    </section>

    <section class="profile-section">
      <h3>Аккаунт</h3>
      <div class="account-info-wrap">
        <div class="account-info-row">
          <p>Имя</p>
          <h4>Иван Иванов</h4>
        </div>
        <div class="account-info-row">
          <p>Логин</p>
          <h4>ivan_ivanov</h4>
        </div>
      </div>
    </section>

  </main>

</body>
</html>
